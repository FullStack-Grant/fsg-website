# Neue Baselines für die visuelle Regression (WEB T11, T4 6.5 Nr. 4): nur im Linux-Container.
# Auslöser: Label „snapshots-aktualisieren“ am PR (oder manuell). Ergebnis als Artefakt „snapshots“;
# Claude lädt es herunter, committet die PNGs in den PR, Felix sieht die Bilder im PR und gibt mit dem PR frei.
name: Snapshots aktualisieren

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'snapshots-aktualisieren'
    name: snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx astro build --outDir dist-vorschau
        env: { FSG_VORSCHAU: '1' }
      - name: Baselines neu aufnehmen (nur geänderte und fehlende)
        run: npx playwright test --grep Visuell --update-snapshots=changed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: tests/__screenshots__
          retention-days: 7
